name: Sync Quinyx Schedule
on:
  # Var sjätte timme. GitHub startar schemalagda körningar ofta flera timmar sent,
  # så den tidigare spärren "bara klockan 19 svensk tid" gjorde att jobbet hoppade
  # över varje körning från 13 november. Filen skrivs bara när schemat faktiskt ändrats.
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:       # Manuell körning från Actions-fliken

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Quinyx Webcal
        run: |
          # Vi kör utan User-Agent för att Quinyx ska skicka med fullständig data
          curl -fsSL "https://app.quinyx.com/webcal/?id=a4bee41611fc30679551a7a595abe310" -o ny.ics
          # Skriv bara över om svaret är ett riktigt schema – ett felsvar får aldrig ersätta reserven
          if grep -q "BEGIN:VCALENDAR" ny.ics && grep -q "BEGIN:VEVENT" ny.ics; then mv ny.ics schema.ics; else echo "Ogiltigt svar, behåller förra schemat"; rm -f ny.ics; fi

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add schema.ics
          # Kontrollerar om filen faktiskt har ändrats innan commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-uppdaterat schema via GitHub Action" && git push)
