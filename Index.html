<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SalesFlow</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#eef2f7;
    --card:#f4f7fb;
    --blue:#2563eb;
    --green:#16a34a;
    --red:#ef4444;
    --text:#0f172a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    flex-direction:column;
    height:100%;
    padding:14px;
    gap:14px;
}

.card{
    background:var(--card);
    border-radius:28px;
    box-shadow:
    8px 8px 20px rgba(163,177,198,.25),
    -8px -8px 20px rgba(255,255,255,.8);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-weight:800;
    font-size:20px;
}

.logo span{
    color:var(--blue);
}

.hero{
    padding:22px;
}

.small{
    font-size:11px;
    opacity:.6;
    font-weight:700;
    text-transform:uppercase;
}

.big{
    font-size:42px;
    font-weight:800;
    color:var(--blue);
    line-height:1;
    margin-top:6px;
}

.progress{
    margin-top:20px;
    height:12px;
    background:#dbe4ef;
    border-radius:999px;
    overflow:hidden;
}

.progressFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#2563eb,#60a5fa);
    transition:.4s;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    text-align:center;
    padding:18px;
}

.stats h3{
    font-size:11px;
    opacity:.6;
    text-transform:uppercase;
}

.stats p{
    margin-top:6px;
    font-size:24px;
    font-weight:800;
}

.calendar{
    flex:1;
    padding:18px;
    overflow:auto;
}

.calHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.calHeader button{
    border:none;
    background:white;
    width:38px;
    height:38px;
    border-radius:14px;
    font-size:18px;
    font-weight:800;
}

.grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.dayName{
    text-align:center;
    font-size:11px;
    font-weight:700;
    opacity:.5;
}

.day{
    aspect-ratio:1;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-weight:800;
    background:white;
    cursor:pointer;
    transition:.15s;
    position:relative;
}

.day:active{
    transform:scale(.92);
}

.day span{
    font-size:10px;
    opacity:.6;
}

.done{
    background:var(--blue);
    color:white;
}

.today{
    border:3px solid var(--blue);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modalBox{
    width:100%;
    max-width:340px;
    background:var(--card);
    border-radius:28px;
    padding:22px;
}

input{
    width:100%;
    border:none;
    padding:16px;
    margin-top:12px;
    border-radius:16px;
    font-size:16px;
    font-weight:700;
    background:white;
}

.modalBtns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
}

.modalBtns button{
    border:none;
    padding:14px;
    border-radius:16px;
    font-weight:800;
}

.blue{
    background:var(--blue);
    color:white;
}

.red{
    background:#fee2e2;
    color:var(--red);
}
</style>
</head>

<body>

<!-- Bättre cache-buster för TrebEdit/Chrome -->
<script>
(function(){
    var url = location.href.split('#')[0];
    if(url.indexOf('v=') === -1){
        var sep = url.indexOf('?') === -1 ? '?' : '&';
        location.replace(url + sep + 'v=' + Date.now());
    }
})();
</script>

<div class="app">

    <div class="header">
        <div class="logo">Sales<span>Flow</span></div>
    </div>

    <div class="card" style="padding:14px; display:flex; gap:10px; justify-content:center;">
        <button id="tabMonth" onclick="setView('month')" class="blue" style="padding:10px 18px; border-radius:14px; font-weight:800; color:white;">Månad</button>
        <button id="tabWeek" onclick="setView('week')" style="padding:10px 18px; border-radius:14px; font-weight:800;">Vecka</button>
    </div>

    <div class="card hero">
        <div class="small">Månadens försäljning</div>
        <div class="big" id="sales">0</div>
        <div style="margin-top:10px;font-weight:700">
            Budget:
            <span id="budget">240 000</span>
        </div>
        <div class="progress">
            <div class="progressFill" id="bar"></div>
        </div>
        <div style="margin-top:10px;font-size:13px;font-weight:700">
            <span id="percent">0%</span> klart
        </div>
    </div>

    <div class="card stats">
        <div>
            <h3>Snitt</h3>
            <p id="avg">0</p>
        </div>
        <div>
            <h3>Dagar</h3>
            <p id="days">0</p>
        </div>
        <div>
            <h3>Kvar</h3>
            <p id="left">0</p>
        </div>
    </div>

    <div id="monthView" class="card calendar">
        <div class="calHeader">
            <button onclick="changeMonth(-1)">←</button>
            <h2 id="monthTitle"></h2>
            <button onclick="changeMonth(1)">→</button>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <div id="weekView" style="display:none;">
        <div class="card" style="padding:20px; height:100%; overflow:auto;">
            <h2 style="font-weight:800; margin-bottom:14px;">Veckovis försäljning</h2>
            <div id="weekList"></div>
        </div>
    </div>

</div>

<div class="modal" id="modal">
    <div class="modalBox">
        <h2 id="modalDate">Dag</h2>
        <input type="number" id="saleInput" placeholder="Försäljning">
        <div class="modalBtns">
            <button onclick="saveDay()" class="blue">Spara</button>
            <button onclick="removeDay()" class="red">Rensa</button>
        </div>
    </div>
</div>

<script>
// NYCKELN ÄR OCKSÅ NY: så du inte återanvänder gammal localStorage
const DB_KEY = "salesflow_v2";

let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
    budget:240000,
    days:{},
    monthlyTotals:{},
    weeklyTotals:{},
    settings:{
        weeklyGoal:60000
    }
};

let currentDate = new Date();
let activeDate = "";

function saveDB(){
    localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function format(n){
    return Number(n || 0).toLocaleString("sv-SE", { maximumFractionDigits:0 });
}

function changeMonth(dir){
    currentDate.setMonth(currentDate.getMonth()+dir);
    render();
    if(document.getElementById("weekView").style.display === "block"){
        renderWeeks();
    }
}

function setView(v){
    const monthView = document.getElementById("monthView");
    const weekView = document.getElementById("weekView");
    const tabMonth = document.getElementById("tabMonth");
    const tabWeek = document.getElementById("tabWeek");

    if(v === "month"){
        monthView.style.display = "block";
        weekView.style.display = "none";
        tabMonth.classList.add("blue");
        tabMonth.style.color = "white";
        tabWeek.classList.remove("blue");
        tabWeek.style.color = "black";
    }else{
        monthView.style.display = "none";
        weekView.style.display = "block";
        tabWeek.classList.add("blue");
        tabWeek.style.color = "white";
        tabMonth.classList.remove("blue");
        tabMonth.style.color = "black";
        renderWeeks();
    }
}

function getWeekNumber(date){
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
    return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

function renderWeeks(){
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const totalDays = new Date(year, month+1, 0).getDate();

    let weeks = {};

    for(let d=1; d<=totalDays; d++){
        const date = new Date(year, month, d);
        const key = `${year}-${month+1}-${d}`;
        const w = getWeekNumber(date);
        if(!weeks[w]) weeks[w] = 0;
        weeks[w] += db.days[key] || 0;
    }

    const container = document.getElementById("weekList");
    container.innerHTML = "";

    const weekNumbers = Object.keys(weeks).sort((a,b)=>a-b);

    weekNumbers.forEach(w=>{
        const total = weeks[w];
        const avg = total / 7;
        container.innerHTML += `
            <div style="padding:14px 0; border-bottom:1px solid #ddd;">
                <div style="font-weight:800;">Vecka ${w}</div>
                <div style="margin-top:6px;">Totalt: <b>${format(total)}</b> kr</div>
                <div>Snitt per dag: <b>${format(avg)}</b> kr</div>
            </div>
        `;
    });

    if(weekNumbers.length === 0){
        container.innerHTML = `<div style="opacity:.6;">Inga registrerade dagar denna månad ännu.</div>`;
    }
}

function render(){
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthNames = [
        "Januari","Februari","Mars","April",
        "Maj","Juni","Juli","Augusti",
        "September","Oktober","November","December"
    ];

    document.getElementById("monthTitle").innerText =
        `${monthNames[month]} ${year}`;

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    ["Må","Ti","On","To","Fr","Lö","Sö"].forEach(d=>{
        grid.innerHTML += `<div class="dayName">${d}</div>`;
    });

    const firstDay = (new Date(year,month,1).getDay() || 7)-1;
    const totalDays = new Date(year,month+1,0).getDate();

    for(let i=0;i<firstDay;i++){
        grid.innerHTML += `<div></div>`;
    }

    let totalSales = 0;
    let worked = 0;

    for(let d=1; d<=totalDays; d++){
        const key = `${year}-${month+1}-${d}`;
        const value = db.days[key] || 0;

        if(value > 0){
            totalSales += value;
            worked++;
        }

        const today = new Date();
        const isToday =
            d === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear();

        grid.innerHTML += `
            <div
                class="day ${value ? 'done':''} ${isToday ? 'today':''}"
                onclick="openModal('${key}',${d})"
            >
                ${d}
                <span>${value ? Math.round(value/1000)+'k':''}</span>
            </div>
        `;
    }

    const avg = worked ? totalSales/worked : 0;
    const left = Math.max(0,db.budget-totalSales);
    const percent = db.budget > 0 ? Math.min(100,(totalSales/db.budget)*100) : 0;

    document.getElementById("sales").innerText = format(totalSales);
    document.getElementById("budget").innerText = format(db.budget);
    document.getElementById("avg").innerText = format(avg);
    document.getElementById("days").innerText = worked;
    document.getElementById("left").innerText = format(left);
    document.getElementById("percent").innerText = Math.round(percent)+"%";
    document.getElementById("bar").style.width = percent+"%";
}

function openModal(key,day){
    activeDate = key;

    const modal = document.getElementById("modal");
    modal.style.display = "flex";

    const todaySales = db.days[key] || 0;
    const avgText = document.getElementById("avg").innerText.replace(/\s/g,'');
    const avg = Number(avgText) || 0;

    let diff = todaySales - avg;
    let diffText = "";

    if(avg === 0 && todaySales === 0){
        diffText = "Ingen försäljning registrerad ännu.";
    }else if(avg === 0){
        diffText = `+${format(todaySales)} över nuvarande snitt (som är 0).`;
    }else{
        diffText = diff >= 0
            ? `+${format(diff)} över snitt`
            : `${format(diff)} under snitt`;
    }

    document.getElementById("modalDate").innerHTML =
        "Dag " + day + `<br><span style='font-size:13px; opacity:.7;'>${diffText}</span>`;

    document.getElementById("saleInput").value =
        db.days[key] || "";
}

function saveDay(){
    const val = Number(document.getElementById("saleInput").value) || 0;

    if(val > 0){
        db.days[activeDate] = val;
    }else{
        delete db.days[activeDate];
    }

    saveDB();
    closeModal();
    render();
    if(document.getElementById("weekView").style.display === "block"){
        renderWeeks();
    }
}

function removeDay(){
    delete db.days[activeDate];
    saveDB();
    closeModal();
    render();
    if(document.getElementById("weekView").style.display === "block"){
        renderWeeks();
    }
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

document.getElementById("modal").addEventListener("click",(e)=>{
    if(e.target.id === "modal"){
        closeModal();
    }
});

render();
setView("month");
</script>

</body>
</html>
